[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    '@openzeppelin/contracts@5.3.0/=lib/openzeppelin-contracts-5.3.0/contracts/',
    #'@openzeppelin/=lib/openzeppelin-contracts/',
    '@ccip/contracts/=lib/chainlink-ccip/chains/evm/contracts/',
    '@chainlink/contracts/=lib/chainlink-evm/contracts/',
    '@chainlink-local/=lib/chainlink-local/',
]

[rpc_endpoints]
eth-sepolia = "https://eth-sepolia.g.alchemy.com/v2/lme6xFGwegQEfeNV4o_Xy"
arb-sepolia = "https://arb-sepolia.g.alchemy.com/v2/lme6xFGwegQEfeNV4o_Xy"


[lint]
exclude_lints = [
    "mixed-case-variable",
    "mixed-case-function",
    "screaming-snake-case-immutable",
    "unwrapped-modifier-logic",
    "unsafe-typecast",
    "screaming-snake-case-const",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
